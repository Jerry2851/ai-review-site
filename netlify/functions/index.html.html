<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Product Review Search Engine</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 40px;
            text-align: center;
        }
        h1 {
            color: #333;
        }
        #searchBox {
            width: 300px;
            padding: 10px;
            font-size: 16px;
        }
        #searchButton {
            padding: 10px 20px;
            font-size: 16px;
            margin-left: 10px;
            cursor: pointer;
        }
        #results {
            margin-top: 40px;
            font-size: 18px;
            color: #555;
        }
    </style>
</head>
<body>

    <h1>AI Product Review Search Engine</h1>
    <p>Type any product name below. (AI functionality coming soon.)</p>

    <input id="searchBox" type="text" placeholder="e.g. Hamilton Beach Toaster">
    <button id="searchButton">Search</button>

    <div id="results">
        <p>Your results will appear here once AI is connected.</p>
    </div>
<div id="results">
    <p>Your results will appear here once AI is connected.</p>
</div>

<!-- AI CODE GOES HERE -->
<script>
async function runSearch() {
    const query = document.getElementById("searchBox").value.trim();
    const resultsDiv = document.getElementById("results");

    if (!query) {
        resultsDiv.innerHTML = "<p>Please enter a product name.</p>";
        return;
    }

    resultsDiv.innerHTML = "<p>Searching…</p>";

    try {
        const response = await fetch("https://api.monkedev.com/fun/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                message: `Summarize product reviews for: ${query}. Keep it short and helpful.`
            })
        });

        const data = await response.json();

        resultsDiv.innerHTML = `<p>${data.response}</p>`;
    } catch (error) {
        resultsDiv.innerHTML = "<p>Error: Could not fetch AI results.</p>";
    }
}

document.getElementById("searchButton").addEventListener("click", runSearch);
</script>
